{% extends "inspections/base.html" %}
{% block title %}500 Server Error · Visual Inspection{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="bg-danger bg-opacity-10 text-danger d-inline-flex p-4 rounded-circle mb-3">
      <i class="bi bi-exclamation-triangle-fill fs-1 text-danger"></i>
    </div>
    <h1 class="h3 fw-bold text-dark">500 — Server Error</h1>
    <p class="text-secondary mb-4">
      An unexpected internal server error occurred while processing the inspection request.
    </p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
