{% extends "inspections/base.html" %}
{% block title %}404 Page Not Found · Visual Inspection{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="bg-warning bg-opacity-10 text-warning d-inline-flex p-4 rounded-circle mb-3">
      <i class="bi bi-question-circle-fill fs-1 text-warning"></i>
    </div>
    <h1 class="h3 fw-bold text-dark">404 — Page Not Found</h1>
    <p class="text-secondary mb-4">
      The requested inspection record, batch, or page could not be located.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{% url 'dashboard' %}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i> Return to Dashboard
      </a>
      <a href="{% url 'history' %}" class="btn btn-outline-secondary">
        <i class="bi bi-clock-history me-1"></i> Browse History
      </a>
    </div>
  </div>
</div>
{% endblock %}
